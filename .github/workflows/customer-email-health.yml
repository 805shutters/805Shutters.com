name: Customer email delivery health
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: Read-only health or provider readiness check
        type: choice
        options: [health, readiness]
        default: health
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check forward email delivery and worker heartbeat
        env:
          CHECK_MODE: ${{ inputs.check || 'health' }}
          CHECK_SECRET: ${{ secrets.APPOINTMENT_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 60 --output health.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CHECK_SECRET}" \
            "https://www.805shutters.com/api/cron/customer-signed-contract-email/?check=${CHECK_MODE}")
          cat health.json
          test "$status" = "200"
          if [ "$CHECK_MODE" = "readiness" ]; then
            jq -e '.ok == true and .providerReady == true' health.json
          else
            jq -e '.ok == true and .activated == true and .stale == false and .attention == 0 and .missing == 0 and .providerConfigured == true' health.json
          fi
