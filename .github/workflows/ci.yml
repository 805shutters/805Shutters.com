name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: line_event_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d line_event_queue"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test
        env:
          LINE_EVENT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/line_event_queue

      - name: Install anatomy test browser
        run: npx playwright install --with-deps chromium

      - name: Contract component attachment regression
        run: npm run test:anatomy

      - name: Typecheck
        run: |
          # The anatomy browser boots `next dev`, which writes
          # .next/dev/types/validator.ts. Shutting that server down can leave
          # the file mid-write, and tsc includes it. A finished copy parses;
          # the partial one does not. Drop it and let `next build` generate
          # the production route types.
          rm -f .next/dev/types/validator.ts
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Public sitemap and internal links
        run: node --test scripts/short-url-redirects.test.mjs scripts/public-site-integrity.test.mjs
