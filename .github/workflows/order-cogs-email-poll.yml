name: Poll order COGS emails

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: order-cogs-email-poll
  cancel-in-progress: false

jobs:
  poll-order-cogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Process manufacturer order confirmations
        env:
          ORDER_COGS_CRON_SECRET: ${{ secrets.ORDER_COGS_CRON_SECRET }}
          ORDER_COGS_CRON_URL: https://www.805shutters.com/api/cron/order-cogs/
          EXPECTED_ORDER_COGS_MAILBOX: 805shutters@gmail.com
        run: node scripts/poll_order_cogs.mjs
