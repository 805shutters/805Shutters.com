name: Appointment reminder service dry-run

# GitHub scheduled jobs were delayed beyond the permitted Pacific hour.
# Vercel owns the minute-level schedule; this workflow NEVER sends.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reminder-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the reminder service without customer sends
        env:
          APPOINTMENT_REMINDER_CRON_SECRET: ${{ secrets.APPOINTMENT_REMINDER_CRON_SECRET }}
        run: node scripts/check-appointment-reminders.mjs
