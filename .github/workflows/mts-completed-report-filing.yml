name: File completed MTS service reports

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: mts-completed-report-filing
  cancel-in-progress: false

jobs:
  file-completed-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label and archive verified completed reports
        env:
          MTS_COMPLETED_REPORT_CRON_SECRET: ${{ secrets.MTS_COMPLETED_REPORT_CRON_SECRET || secrets.INSTALLATION_INVOICE_CRON_SECRET || secrets.CRON_SECRET }}
        run: |
          test -n "${MTS_COMPLETED_REPORT_CRON_SECRET}"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${MTS_COMPLETED_REPORT_CRON_SECRET}" \
            https://www.805shutters.com/api/cron/mts-completed-reports
